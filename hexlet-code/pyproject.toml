[project]
name = "kristina"
version = "0.1.0"
description = "Brain Games collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"prompt",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
brain-games = "brain_games.scripts.brain_games:main"


[tool.hatch.build.targets.wheel]
packages = ["brain_games"]

